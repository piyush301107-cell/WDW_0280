<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="font-family: Georgia, serif; margin: 0;">

    
    <header style="background-color: #162273; color: white; text-align: center; padding: 15px;">
        <h1>ABC College Admission 2026</h1>
    </header>

    
    <main style="width: 550px; margin: 20px auto;">
        
        <h2>Courses and Fees</h2>
        
        <table border="1" cellpadding="8" cellspacing="0" width="100%">
            <caption>Available Courses</caption>
            <tr style="background-color: #e6e9f5;">
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>&#8377;90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377;45,000</td>
            </tr>
        </table>

        <br>

     
        <form action="#" method="POST">
            <fieldset>
                <legend>Application Form</legend>
                
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" size="35" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" size="35" required><br><br>

                <label for="course">Course:</label><br>
                <select id="course" name="course">
                    <option value="cse">B.Tech CSE</option>
                    <option value="bca">BCA</option>
                </select><br><br>

                <label for="msg">Statement:</label><br>
                <textarea id="msg" name="msg" rows="4" cols="50" required></textarea><br><br>

                <input type="submit" value="Apply">
            </fieldset>
        </form>

    </main>

    <footer style="background-color: #162273; color: white; text-align: center; padding: 10px; margin-top: 20px;">
        <p>&copy; 2026 ABC College</p>
    </footer>

</body>
</html>
